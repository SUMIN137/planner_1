<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fafafa">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>플래너</title>
<script>
  try { var p = localStorage.getItem("theme"); if (p === "light" || p === "dark") document.documentElement.setAttribute("data-theme", p); } catch (e) {}
  // 무료 웹폰트: 고른 글꼴만 내려받음 (오프라인이면 기본 글꼴로 자동 대체)
  window.FONT_URLS = {
    pretendard: "https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css",
    noto: "https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap",
    gowun: "https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap"
  };
  window.loadFont = function (k) {
    if (!window.FONT_URLS[k] || document.getElementById("font-" + k)) return;
    var l = document.createElement("link"); l.id = "font-" + k; l.rel = "stylesheet"; l.href = window.FONT_URLS[k]; document.head.appendChild(l);
  };
  try { var f = localStorage.getItem("font"); if (f && window.FONT_URLS[f]) { document.documentElement.setAttribute("data-font", f); window.loadFont(f); } } catch (e) {}
</script>
<style>
  /* =========================================================
     디자인 시스템 — 무채색 + 라이트/다크 (CSS 변수만 바꿔서 전환)
     일정 색 = 3개 변수:  --ef 채움색(종일 바) / --ec 포인트색(점·선) / --et 바 위 글자색
     ========================================================= */
  :root {
    --bg: #fafafa; --surface: #ffffff; --ink: #141414; --inkfg: #fafafa;
    --sub: #767676; --line: #e4e4e2; --hover: #f1f1ef;
    --sun: #d6454b; --sat: #3b6fd8; --hkr: #d6454b; --hca: #2f8f6a; /* 일요일 빨강 · 토요일 파랑 · 한국 공휴일 · 캐나다 공휴일 */
    --g: #4fa56f; --y: #d9b43c; --r: #d9685e;
    /* 연한(파스텔) 채움색 */
    --c0: #ebebe8; --c1: #f9d9d6; --c2: #fbe3c8; --c3: #f6edbd;
    --c4: #d6ecd6; --c5: #d2e9ee; --c6: #d9e0f7; --c7: #e7dbf3;
    /* 파스텔 색의 점·선용 포인트색 */
    --d0: #9a9a96; --d1: #e08a84; --d2: #e6a566; --d3: #d6bf55;
    --d4: #6fb585; --d5: #5fb0bf; --d6: #7f93e0; --d7: #a889d4;
    /* 진한 단색 */
    --s1: #d6454b; --s2: #d9731c; --s3: #a88a00; --s4: #2f9e5f;
    --s5: #1d8f9a; --s6: #3b6fd8; --s7: #7a5bd6; --s8: #c2468a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101010; --surface: #181818; --ink: #ececec; --inkfg: #101010; --sub: #9b9b9b;
      --line: #2b2b2b; --hover: #212121; --sun: #ff8a84; --sat: #7ea4ff; --hkr: #ff8a84; --hca: #5fc08a;
      --c0: #2b2b2a; --c1: #51302e; --c2: #52402a; --c3: #4c4724;
      --c4: #2d4533; --c5: #28444c; --c6: #2f3655; --c7: #41314f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101010; --surface: #181818; --ink: #ececec; --inkfg: #101010; --sub: #9b9b9b;
    --line: #2b2b2b; --hover: #212121; --sun: #ff8a84; --sat: #7ea4ff; --hkr: #ff8a84; --hca: #5fc08a;
    --c0: #2b2b2a; --c1: #51302e; --c2: #52402a; --c3: #4c4724;
    --c4: #2d4533; --c5: #28444c; --c6: #2f3655; --c7: #41314f;
  }
  .col-c0 { --ef: var(--c0); --ec: var(--d0); --et: var(--ink); }
  .col-c1 { --ef: var(--c1); --ec: var(--d1); --et: var(--ink); }
  .col-c2 { --ef: var(--c2); --ec: var(--d2); --et: var(--ink); }
  .col-c3 { --ef: var(--c3); --ec: var(--d3); --et: var(--ink); }
  .col-c4 { --ef: var(--c4); --ec: var(--d4); --et: var(--ink); }
  .col-c5 { --ef: var(--c5); --ec: var(--d5); --et: var(--ink); }
  .col-c6 { --ef: var(--c6); --ec: var(--d6); --et: var(--ink); }
  .col-c7 { --ef: var(--c7); --ec: var(--d7); --et: var(--ink); }
  .col-s1 { --ef: var(--s1); --ec: var(--s1); --et: #fff; } .col-s2 { --ef: var(--s2); --ec: var(--s2); --et: #fff; }
  .col-s3 { --ef: var(--s3); --ec: var(--s3); --et: #fff; } .col-s4 { --ef: var(--s4); --ec: var(--s4); --et: #fff; }
  .col-s5 { --ef: var(--s5); --ec: var(--s5); --et: #fff; } .col-s6 { --ef: var(--s6); --ec: var(--s6); --et: #fff; }
  .col-s7 { --ef: var(--s7); --ec: var(--s7); --et: #fff; } .col-s8 { --ef: var(--s8); --ec: var(--s8); --et: #fff; }

  :root { --font: -apple-system, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
  :root[data-font="pretendard"] { --font: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; }
  :root[data-font="noto"] { --font: "Noto Sans KR", "Malgun Gothic", sans-serif; }
  :root[data-font="gowun"] { --font: "Gowun Dodum", "Malgun Gothic", sans-serif; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 15px/1.45 var(--font); }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  input, select, textarea { font: inherit; color: inherit; background: var(--surface); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 10px; outline: none; width: 100%; }
  textarea { resize: vertical; min-height: 96px; }
  input:focus, select:focus, textarea:focus { border-color: var(--ink); }
  input[type="date"], input[type="time"] { min-height: 40px; }
  .tf { display: flex; align-items: center; gap: 6px; }
  .tf select { width: auto; min-width: 64px; }
  .tf.empty select { color: var(--sub); }
  .tf-ap { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: none; }
  .tf-ap span { padding: 9px 10px; font-size: 13px; color: var(--sub); }
  .tf-ap span.on { background: var(--ink); color: var(--inkfg); font-weight: 700; }
  .tf-ap:disabled { opacity: .45; }
  .tf-c { color: var(--sub); }
  .hidden { display: none !important; }
  .sub { color: var(--sub); }
  .txtbtn { color: var(--sub); font-size: 13px; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
  .txtbtn:hover { background: var(--hover); color: var(--ink); }
  .txtbtn:disabled { opacity: .3; cursor: default; }
  .btn { background: var(--ink); color: var(--inkfg); border-radius: 9px; padding: 11px 16px; font-weight: 600; text-align: center; }
  .btn.ghost, .btn.danger { background: none; color: var(--ink); border: 1px solid var(--line); }
  .btn.small { padding: 7px 12px; font-size: 13px; }

  #login { text-align: center; padding: 20vh 24px 0; }
  #login h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  #login p { color: var(--sub); margin: 0 0 26px; }
  #loginErr { color: var(--sub); font-size: 13px; margin-top: 14px; white-space: pre-wrap; }

  /* =========================================================
     레이아웃
     모바일: 하단 5탭(보관함 = 아이디어 → 폴더 → 진행바 세로 흐름) / PC(1200px↑): 아이디어 저장소(항상) | [달력 화면에서만: 폴더 | 진행바] | 메인
     ========================================================= */
  #shell { min-height: 100dvh; display: block; padding-bottom: 64px; }
  #top { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between;
    height: 48px; padding: 0 14px; background: var(--bg); border-bottom: 1px solid var(--line); }
  .logo { font-weight: 700; letter-spacing: -.2px; }
  #nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; display: flex; background: var(--bg);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  #nav button { flex: 1; text-align: center; padding: 15px 0; color: var(--sub); font-size: 12.5px; }
  #nav button.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 2px 0 var(--ink); }
  .topr { display: flex; gap: 6px; }
  #themeBtn, #fontBtn { color: var(--sub); font-size: 13px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; }

  #side, #fside, #pside { padding: 0 14px 24px; }
  #main { padding: 0 14px 24px; }
  #main > section { display: none; }
  #shell[data-eff="plan"] #plan, #shell[data-eff="routine"] #routine,
  #shell[data-eff="journal"] #journal, #shell[data-eff="track"] #track { display: block; }
  #shell:not([data-tab="dump"]) #side, #shell:not([data-tab="dump"]) #fside, #shell:not([data-tab="dump"]) #pside { display: none; }
  #shell[data-tab="dump"] #main { display: none; }
  #shell:not([data-eff="routine"]) #lowBtn { display: none; }
  #shell:not([data-eff="plan"]) #viewSeg, #shell:not([data-eff="plan"]) #holBtn, #shell:not([data-eff="plan"]) #addEv, #shell:not([data-eff="plan"]) #fab { display: none; }
  #shell[data-eff="journal"] #daybar, #shell[data-eff="journal"] #progBar { display: none; }
  #addEv { display: none; }

  @media (min-width: 1200px) {
    #shell { height: 100dvh; min-height: 0; padding-bottom: 0; display: grid;
      grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
      grid-template-areas: "top top" "side main"; }
    #shell[data-eff="plan"] { grid-template-columns: 220px 180px 210px minmax(0, 1fr); grid-template-areas: "top top top top" "side fside pside main"; }
    #shell:not([data-eff="plan"]) #fside, #shell:not([data-eff="plan"]) #pside { display: none !important; }
    #top { grid-area: top; position: relative; }
    #top #nav { position: absolute; left: 50%; transform: translateX(-50%); top: 0; bottom: 0; right: auto; border: 0; background: none; padding: 0; }
    #nav button { padding: 0 18px; display: grid; place-items: center; flex: none; font-size: 14px; }
    #nav button[data-tab="dump"] { display: none; }
    #side { grid-area: side; overflow: hidden; border-right: 1px solid var(--line); display: flex !important; flex-direction: column; }
    #dumpList { flex: 1; min-height: 0; overflow: auto; }
    #fside { grid-area: fside; overflow: auto; border-right: 1px solid var(--line); display: block !important; }
    #pside { grid-area: pside; overflow: auto; border-right: 1px solid var(--line); display: block !important; }
    #main { grid-area: main; overflow: auto; padding: 0 22px 24px; display: block !important; }
    #shell[data-eff="plan"] #addEv { display: inline-block; }
    #fab { display: none !important; }
  }
  @media (min-width: 1400px) { #shell { grid-template-columns: 250px minmax(0, 1fr); } #shell[data-eff="plan"] { grid-template-columns: 250px 220px 250px minmax(0, 1fr); } }
  @media (min-width: 1700px) { #shell { grid-template-columns: 290px minmax(0, 1fr); } #shell[data-eff="plan"] { grid-template-columns: 290px 280px 310px minmax(0, 1fr); } }
  @media (max-width: 1199px) { /* 모바일: 아이디어 저장소 → 폴더 → 진행바 로 이어지는 세로 흐름 */
    #fside, #pside { border-top: 1px solid var(--line); margin-top: 6px; }
    #dumpList { max-height: 46dvh; overflow: auto; }
  }
  #fab { position: fixed; right: 18px; bottom: calc(76px + env(safe-area-inset-bottom)); z-index: 11; width: 52px; height: 52px; border-radius: 50%;
    background: var(--ink); color: var(--inkfg); font-size: 28px; line-height: 1; text-align: center; box-shadow: 0 4px 14px rgba(0,0,0,.25); }

  #dumpForm, #pForm { position: sticky; top: 49px; z-index: 5; background: var(--bg); padding: 12px 0 8px; }
  @media (min-width: 1200px) { #dumpForm, #pForm { top: 0; } }
  #dumpInput, #pInput { font-size: 17px; padding: 14px 14px; border-radius: 12px; }
  @media (min-width: 1200px) { #dumpInput, #pInput { font-size: 15px; padding: 11px 12px; } }
  .hint { font-size: 12px; color: var(--sub); margin: 6px 2px 0; }

  .sec-h { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 6px;
    font-size: 12px; letter-spacing: .4px; color: var(--sub); border-radius: 6px; gap: 6px; }
  .sec-h.first { margin-top: 12px; }
  .sec-h.over, .frow.over { background: var(--hover); outline: 1px dashed var(--sub); }
  .empty { color: var(--sub); font-size: 13px; padding: 6px 4px; }

  .task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; align-items: center; gap: 8px;
    padding: 8px 4px; border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task[draggable="true"] { cursor: grab; }
  .check { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--sub); display: grid; place-items: center;
    font-size: 13px; line-height: 1; color: var(--inkfg); text-align: center; flex: none; }
  .check.on, .task.done .check { background: var(--ink); border-color: var(--ink); }
  .check.b { background: transparent; color: var(--ink); border-color: var(--ink); font-weight: 700; font-size: 11px; }
  .title { display: block; line-height: 1.35; word-break: break-word; position: relative; }
  .title small { display: block; color: var(--sub); font-size: 12px; margin-top: 1px; }
  .title > span { position: relative; }
  .sw { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; background: var(--ec, var(--d0)); }
  .task.done .title { color: var(--sub); }
  .task.done .title > span::after { content: ""; position: absolute; left: 0; top: .72em; height: 1px; width: 100%; background: var(--sub); }
  .task.pop .check { animation: pop .35s ease; }
  .task.pop .title > span::after { animation: strike .3s ease; transform-origin: left; }
  @keyframes pop { 0% { transform: scale(.7); } 55% { transform: scale(1.25); } 100% { transform: scale(1); } }
  @keyframes strike { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: transparent; border: 1.5px solid var(--line); }
  .dot.e1 { background: var(--g); border-color: var(--g); }
  .dot.e2 { background: var(--y); border-color: var(--y); }
  .dot.e3 { background: var(--r); border-color: var(--r); }
  .acts { display: flex; align-items: center; gap: 2px; }

  /* 폴더 트리 */
  .frow { display: flex; align-items: center; gap: 2px; padding: 6px 2px; border-radius: 8px; position: relative; }
  .frow:hover { background: var(--hover); }
  .frow.top { background: color-mix(in srgb, var(--ink) 8%, transparent); margin-top: 6px; } /* 상위 폴더 = 투명한 회색 바 */
  .frow.top:hover { background: color-mix(in srgb, var(--ink) 13%, transparent); }
  .frow[draggable="true"] { cursor: grab; }
  .frow.drop-before::before, .frow.drop-after::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--ink); }
  .frow.drop-before::before { top: -1px; } .frow.drop-after::after { bottom: -1px; }
  .caret { width: 22px; color: var(--sub); text-align: center; }
  .fname { flex: 1; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cnt { font-size: 12px; color: var(--sub); padding: 0 4px; }
  .fbody .task { padding-left: 24px; }
  .arch-row { display: flex; align-items: center; gap: 6px; padding: 7px 2px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .arch-row .nm { flex: 1; min-width: 0; word-break: break-word; }

  /* 진행바 탭 */
  .pitem, .routine { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .pitem input { -webkit-user-select: text; user-select: text; }
  .sorting { position: relative; z-index: 30; background: var(--surface); box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 10px; transition: none !important; }
  .pitem { padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .pl1 { display: flex; align-items: center; gap: 6px; }
  .pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--r); flex: none; }
  .ptitle { flex: 1; min-width: 0; font-size: 14px; word-break: break-word; }
  .pitem.done .ptitle { color: var(--sub); text-decoration: line-through; }
  .pmeta { font-size: 11px; color: var(--sub); flex: none; }
  .pl2 { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .pbar { position: relative; flex: 1; height: 12px; border-radius: 6px; background: var(--hover); border: 1px solid var(--line); }
  .pbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--r); transition: width .15s; }
  .pbar.full i { background: var(--g); }
  .pbar input[type=range] { position: absolute; left: 0; top: -9px; width: 100%; height: 28px; margin: 0; opacity: 0; cursor: pointer; }
  .pnum { display: flex; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; flex: none; }
  .pnum input { width: 48px; padding: 4px 4px; text-align: right; font-weight: 700; border-radius: 6px; font-size: 13px; }
  .ptoggle { font-size: 12px; color: var(--sub); padding: 8px 2px; }

  /* 날짜 바 */
  #daybar { position: sticky; top: 49px; z-index: 6; background: var(--bg); display: flex; align-items: center; gap: 6px;
    padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  @media (min-width: 1200px) { #daybar { top: 0; } }
  .navb { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 8px; text-align: center; font-size: 16px; }
  #dayPick { width: 150px; border: 0; background: none; font-weight: 700; font-size: 16px; padding: 4px 2px; }
  #rangeLabel { font-weight: 700; font-size: 16px; padding: 0 4px; }
  #dow { color: var(--sub); }
  .grow { flex: 1; }
  #dayProg { font-size: 13px; color: var(--sub); }
  #lowBtn { font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #lowBtn.on { background: var(--ink); color: var(--inkfg); border-color: var(--ink); }
  .vseg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .vseg button { padding: 6px 13px; font-size: 13px; color: var(--sub); text-align: center; }
  .vseg button.on { background: var(--ink); color: var(--inkfg); }
  #progBar { height: 3px; background: var(--line); margin: 0 0 12px; }
  #progBar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s ease; }

  .chip { border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font-size: 13px; color: var(--sub); display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .chip.on { color: var(--inkfg); background: var(--ink); border-color: var(--ink); }

  /* =========================================================
     일정 표시 규칙
       종일 일정  = 배경이 꽉 찬 가로 바
       시간 일정  = 바 없음, 제목 앞에 작은 점(또는 세로선)
     ========================================================= */
  .ev { display: block; width: 100%; font-size: 11px; line-height: 1.35; padding: 1px 4px; margin-top: 2px; border-radius: 4px;
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: left; position: relative; }
  .ev.allday { background: var(--ef, var(--c0)); color: var(--et, var(--ink)); }
  .ev.timed { padding-left: 9px; color: var(--ink); }
  .ev.timed::before { content: ""; position: absolute; left: 3px; top: 50%; width: 2px; height: 12px; margin-top: -6px; border-radius: 2px; background: var(--ec, var(--d0)); }
  .ev.rem { display: flex; align-items: center; gap: 3px; padding: 1px 2px; color: var(--ink); }
  .rchk { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--ec, var(--d0)); flex: none; position: relative; display: grid; place-items: center;
    font-size: 8px; line-height: 1; color: var(--inkfg); background: transparent; text-align: center; }
  .rchk::before { content: ""; position: absolute; inset: -7px; }
  .rchk.on { background: var(--ec, var(--d0)); }
  .rt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: inherit; color: inherit; }
  .ev.done { opacity: .5; text-decoration: line-through; }
  .sun { color: var(--sun) !important; } .sat { color: var(--sat) !important; }
  .hol { display: block; font-size: 9.5px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
  .hol { font-weight: 700; } .hol.kr, .hol.ca { color: var(--sun); } /* 한국(한글)·캐나다(영어) 모두 같은 굵은 빨강 */

  /* 월간 */
  .mgrid { container: mg / inline-size; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); margin-top: 12px; }
  .mh { padding: 6px; font-size: 12px; color: var(--sub); text-align: center; border-bottom: 1px solid var(--line); }
  .mcell { min-height: 108px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px; cursor: pointer; overflow: hidden; position: relative; }
  .mcell:nth-child(7n) { border-right: 0; }
  .mcell.out { opacity: .45; }
  .mcell:hover { background: var(--hover); }
  .mcell .num { font-weight: 800; font-size: 12.5px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; }
  .mcell.today .num { background: var(--ink); color: var(--inkfg) !important; }
  .mcell .dmark { position: absolute; right: 4px; top: 4px; font-size: 10px; color: var(--sub); }
  .mmore { font-size: 10px; color: var(--sub); padding: 1px 4px; }
  @container mg (max-width: 599px) { .mcell { min-height: 92px; padding: 2px; } .ev { font-size: 10px; padding: 1px 2px; } .ev.timed { padding-left: 8px; } .ev.timed::before { left: 2px; } .hol { font-size: 8.5px; } }

  /* 주간: 월~일 7열 압축 시간표 (가로 스크롤 없음) */
  .wkwrap { position: relative; overflow-y: auto; overflow-x: hidden; max-height: calc(100dvh - 230px); min-height: 320px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface); margin-top: 12px; container: wkc / inline-size; }
  .wk { --gw: 26px; display: grid; grid-template-columns: var(--gw) repeat(7, minmax(0, 1fr)); }
  .wktop { position: sticky; top: 0; z-index: 4; background: var(--surface); box-shadow: 0 1px 0 var(--line); }
  .wkhead { border-bottom: 1px solid var(--line); }
  .wkh { display: block; text-align: center; padding: 4px 0 3px; min-width: 0; border-left: 1px solid var(--line); }
  .wkh:first-child { border-left: 0; }
  .wkh .wd { display: block; font-size: 10px; color: var(--sub); }
  .wkh .wn { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; font-size: 12.5px; font-weight: 800; }
  .wkh.today .wn { background: var(--ink); color: var(--inkfg) !important; }
  .ucell { padding: 2px 1px; min-width: 0; border-left: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 1px; cursor: pointer; }
  .ucell.g { border-left: 0; cursor: default; }
  .ucell .ev { font-size: 9px; padding: 0 2px; margin-top: 0; border-radius: 3px; }
  .ucell .ev.rem { padding: 0 1px; }
  .ucell .hol { font-size: 8.5px; padding: 0 1px; }
  .ucell .rchk { width: 10px; height: 10px; font-size: 7px; }
  .gut { position: relative; font-size: 9px; color: var(--sub); }
  .gut span { position: absolute; right: 3px; transform: translateY(-50%); }
  .gut span.f { transform: translateY(2px); } .gut span.l { transform: translateY(calc(-100% - 2px)); }
  .dcol { position: relative; border-left: 1px solid var(--line); background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); cursor: pointer; min-width: 0; }
  .dcol.today { background-color: color-mix(in srgb, var(--hover) 70%, transparent); }
  .blk { position: absolute; border-radius: 4px; padding: 1px 2px 1px 3px; overflow: hidden; font-size: 9px; line-height: 1.15; cursor: pointer; word-break: break-all;
    background: color-mix(in srgb, var(--ec, var(--d0)) 18%, var(--surface)); border-left: 2px solid var(--ec, var(--d0)); }
  .blk b { font-weight: 600; display: block; }
  .blk small { display: block; color: var(--sub); font-size: 8.5px; }
  .blk.done { opacity: .5; }
  .blk.done b { text-decoration: line-through; }
  @container wkc (min-width: 600px) {
    .wk { --gw: 44px; }
    .wkh .wd { font-size: 11px; } .wkh .wn { width: 26px; height: 26px; font-size: 14px; }
    .ucell .ev { font-size: 11px; padding: 1px 4px; } .ucell .hol { font-size: 11px; } .ucell .rchk { width: 12px; height: 12px; font-size: 8px; }
    .blk { font-size: 11.5px; padding: 2px 5px; border-left-width: 3px; border-radius: 6px; word-break: normal; overflow-wrap: anywhere; }
    .blk small { font-size: 10.5px; } .gut { font-size: 11px; }
  }
  .nowline { position: absolute; left: 0; right: 0; border-top: 2px solid var(--ink); pointer-events: none; z-index: 2; }
  .nowline::before { content: ""; position: absolute; left: -3px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }

  /* 일기 탭 */
  .optrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  .optrow .lab { font-size: 12px; color: var(--sub); min-width: 40px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; align-items: center; }
  .qitem { display: block; width: 100%; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .qitem:hover { background: var(--hover); }
  .qtext { white-space: pre-wrap; word-break: break-word; font-size: 15px; }
  .qmeta { font-size: 12px; color: var(--sub); margin-top: 5px; }

  /* 자동완성 팝업 */
  .sgwrap { position: relative; }
  .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 30; background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18); overflow: hidden; }
  .sg { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  .sg:last-child { border-bottom: 0; }
  .sg.on, .sg:hover { background: var(--hover); }
  .sgt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sg small { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .sg i { width: 8px; height: 8px; border-radius: 50%; background: var(--ec, var(--d0)); flex: none; }

  /* 루틴 */
  .catbar { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0 4px; align-items: center; }
  .rcols { display: block; }
  #mealBox { margin-top: 26px; padding-top: 4px; border-top: 1px solid var(--line); }
  @media (min-width: 1200px) { .rcols { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; } #mealBox { margin-top: 0; border-top: 0; border-left: 1px solid var(--line); padding: 0 0 0 24px; } }
  .mealform { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 8px; }
  .mealform input { flex: 1; min-width: 140px; }
  .slotbtn { min-width: 64px; padding: 9px 12px; border: 1px solid var(--ink); border-radius: 8px; text-align: center; font-weight: 700; background: var(--ink); color: var(--inkfg); }
  #mSnack.on { background: var(--ink); color: var(--inkfg); border-color: var(--ink); }
  .msec { margin-top: 14px; }
  .mrow { display: flex; gap: 8px; align-items: baseline; width: 100%; padding: 8px 4px; border-bottom: 1px solid var(--line); font-size: 14px; }
  .mrow:hover { background: var(--hover); }
  .mrow .mt { flex: 1; min-width: 0; word-break: break-word; }
  .mrow.snack { padding-left: 18px; color: var(--sub); }
  .mtag { font-size: 11px; border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; color: var(--sub); flex: none; }
  .rsec { margin-top: 6px; }
  .routine { padding: 10px 4px; border-bottom: 1px solid var(--line); }
  .rhead { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: start; }
  .rtitle { display: block; font-weight: 600; word-break: break-word; }
  .rsub { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
  .planb { display: block; margin-top: 4px; font-size: 13px; color: var(--sub); border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; }
  .planb.on { color: var(--ink); border-color: var(--ink); }
  .strip { display: flex; gap: 4px; margin-top: 8px; padding-left: 36px; }
  .sq { width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--sub); }
  .sq.off { border-color: var(--line); }
  .sq.full { background: var(--ink); border-color: var(--ink); }
  .sq.planb { background: linear-gradient(135deg, var(--ink) 50%, transparent 50%); border-color: var(--ink); }
  .sq.today { outline: 1px solid var(--sub); outline-offset: 1px; }
  .note { font-size: 13px; color: var(--sub); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 12px; }
  .catrow { display: flex; align-items: center; gap: 4px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .catrow .name { flex: 1; font-weight: 600; }

  /* 카드·바·링 (주간 트래커) */
  .card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 14px 0; background: var(--surface); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .desc { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
  .ringbox { display: flex; align-items: center; gap: 18px; }
  .ring { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center;
    background: conic-gradient(var(--rc) calc(var(--p) * 1%), var(--line) 0); flex: none; }
  .ringin { width: 80px; height: 80px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-size: 22px; font-weight: 700; }
  .tierlabel { font-size: 18px; font-weight: 700; }
  .dbars { display: flex; gap: 8px; align-items: flex-end; }
  .dbar { flex: 1; text-align: center; font-size: 12px; color: var(--sub); }
  .dbar .well { height: 72px; background: var(--hover); border-radius: 6px; position: relative; overflow: hidden; margin-bottom: 4px; }
  .dbar .well i { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 6px; transition: height .4s ease; }
  .dbar.today { color: var(--ink); font-weight: 700; }
  .brow { padding: 8px 0; }
  .brow .l1 { display: flex; align-items: baseline; gap: 8px; }
  .brow .nm { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
  .brow.small .nm { font-weight: 400; padding-left: 14px; color: var(--sub); }
  .brow .num { font-size: 12px; color: var(--sub); }
  .brow .tier { font-size: 12px; min-width: 76px; text-align: right; }
  .track { height: 8px; background: var(--hover); border-radius: 99px; overflow: hidden; margin-top: 5px; }
  .track i { display: block; height: 100%; border-radius: 99px; transition: width .4s ease; }
  .brow.small .track { height: 5px; margin-left: 14px; }

  /* 목표 */
  .goal { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .grow-row { display: flex; align-items: center; gap: 4px; }
  .gtitle { flex: 1; min-width: 0; font-weight: 600; word-break: break-word; }
  .gmeta { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .gkids { margin-left: 18px; border-left: 1px solid var(--line); padding-left: 8px; }
  .lvl { font-size: 11px; color: var(--sub); border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; margin-right: 6px; font-weight: 400; }
  .prop { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .prop .t { font-size: 12px; color: var(--sub); white-space: nowrap; }
  .prop .evt { text-align: left; word-break: break-word; }

  /* 모달 */
  #modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.38); display: flex; align-items: flex-end; justify-content: center; }
  #modal .box { background: var(--surface); width: 100%; max-width: 480px; max-height: 90dvh; overflow: auto;
    border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); border: 1px solid var(--line); }
  @media (min-width: 900px) { #modal { align-items: center; } #modal .box { border-radius: 16px; } }
  .box h3 { margin: 0 0 12px; font-size: 15px; }
  .sheethead { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .sheethead h3 { flex: 1; margin: 0; }
  .field { margin-bottom: 12px; }
  .field > label, .flabel { display: block; font-size: 12px; color: var(--sub); margin-bottom: 5px; }
  .row2 { display: flex; gap: 8px; }
  .swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; outline: 1px solid var(--line); outline-offset: -1px; background: var(--ef); }
  .swatches button.on { border-color: var(--ink); box-shadow: 0 0 0 2px var(--surface) inset; }
  .efforts { display: flex; gap: 6px; }
  .efforts button { flex: 1; text-align: center; padding: 8px 0; border: 1px solid var(--line); border-radius: 8px; font-size: 13px; color: var(--sub); }
  .efforts button.on { border-color: var(--ink); color: var(--ink); font-weight: 600; }
  .days { display: flex; gap: 6px; }
  .days button { flex: 1; text-align: center; padding: 9px 0; border: 1px solid var(--line); border-radius: 8px; color: var(--sub); }
  .days button.on { background: var(--ink); color: var(--inkfg); border-color: var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .actions .btn { flex: 1; }
  .list-btn { display: block; width: 100%; padding: 12px 6px; border-bottom: 1px solid var(--line); }
  .list-btn.on { font-weight: 700; }
  .list-btn:hover { background: var(--hover); }
  .diary { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .diary textarea { min-height: 84px; margin-top: 6px; }

  #foot { margin-top: 26px; font-size: 12px; color: var(--sub); }
  #conf { position: fixed; inset: 0; pointer-events: none; z-index: 60; }
  #toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: 84px; z-index: 70; background: var(--ink); color: var(--inkfg);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: 90vw; text-align: center; }
  @media (min-width: 1200px) { #toast { bottom: 28px; } }
</style>
</head>
<body>
<canvas id="conf"></canvas>

<section id="login" class="hidden">
  <h1>플래너</h1>
  <p>떠오르는 대로 적고, 나중에 정리하기</p>
  <button class="btn" id="loginBtn">Google로 시작하기</button>
  <div id="loginErr"></div>
</section>

<div id="shell" class="hidden" data-tab="plan" data-eff="plan">
  <header id="top">
    <div class="logo">플래너</div>
    <nav id="nav">
      <button data-tab="plan">달력</button>
      <button data-tab="dump">보관함</button>
      <button data-tab="routine">루틴</button>
      <button data-tab="journal">일기</button>
      <button data-tab="track">주간</button>
    </nav>
    <div class="topr"><button id="fontBtn" aria-label="글꼴 바꾸기">글꼴</button><button id="themeBtn" aria-label="테마 전환">자동</button></div>
  </header>

  <!-- 1단: 아이디어 저장소 -->
  <aside id="side">
    <div id="dumpForm">
      <input id="dumpInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="떠오르는 아이디어 바로 적기…">
      <div class="hint">끝에 /1 /2 /3 을 붙이면 부담도(짧게·중간·길게)가 지정돼요</div>
    </div>
    <div class="sec-h" id="dumpHead"><span>아이디어 저장소</span><span id="dumpCount"></span></div>
    <div id="dumpList"></div>
  </aside>

  <!-- 2단: 폴더 -->
  <aside id="fside">
    <div class="sec-h first"><span>폴더</span>
      <span><button class="txtbtn" id="reorderBtn">순서 편집</button><button class="txtbtn" id="addRootFolder">+ 폴더</button></span></div>
    <div id="tree"></div>
    <div id="archBox"></div>
    <div id="foot"><span id="who"></span> · <button class="txtbtn" id="logoutBtn" style="padding:0;text-decoration:underline">로그아웃</button></div>
  </aside>

  <!-- 3단: 진행바 (빨간 '길게' 태그 일정) -->
  <aside id="pside">
    <div id="pForm">
      <input id="pInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="오래 걸리는 일 추가…">
      <div class="hint">빨간 태그(/3 길게)가 붙은 일정이 여기에 모여요</div>
    </div>
    <div class="sec-h" id="pHead"><span>진행바</span><span id="pCount"></span></div>
    <div id="pList"></div>
  </aside>

  <main id="main">
    <div id="daybar">
      <button class="navb" id="prevDay" aria-label="이전">‹</button>
      <input id="dayPick" type="date">
      <span id="dow"></span>
      <span id="rangeLabel" class="hidden"></span>
      <button class="navb" id="nextDay" aria-label="다음">›</button>
      <button class="txtbtn" id="todayBtn">오늘</button>
      <div class="vseg" id="viewSeg"><button data-v="week">주</button><button data-v="month" class="on">월</button></div>
      <button class="txtbtn" id="holBtn">공휴일</button>
      <span class="grow"></span>
      <button id="lowBtn">저에너지 모드</button>
      <button class="txtbtn" id="addEv">+ 일정</button>
      <span id="dayProg"></span>
    </div>
    <div id="progBar"><i></i></div>

    <section id="plan">
      <div id="monthView"><div class="mgrid" id="monthGrid"></div></div>
      <div id="weekView" class="hidden">
        <div class="wkwrap" id="wkwrap">
          <div class="wktop"><div class="wk wkhead" id="wkhead"></div><div class="wk" id="wkall"></div></div>
          <div class="wk" id="wkbody"></div>
        </div>
      </div>
    </section>

    <section id="routine">
      <div class="rcols">
        <div id="rmain">
          <div class="catbar" id="catBar"></div>
          <div id="routineNote"></div>
          <div id="routineList"></div>
          <div style="margin-top:14px"><button class="btn ghost" id="addRoutine">+ 루틴 추가</button></div>
        </div>
        <div id="mealBox">
          <div class="sec-h first"><span>식단 기록</span><span id="mealDate"></span></div>
          <div class="mealform">
            <button class="slotbtn" id="mSlot" type="button" aria-label="시간대 바꾸기"></button>
            <button class="chip" id="mSnack" type="button">간식</button>
            <input id="mInput" type="text" autocomplete="off" enterkeyhint="done" placeholder="먹은 것 (예: 계란, 토스트)">
            <button class="btn small" id="mAdd" type="button">추가</button>
          </div>
          <div class="hint">시간대 버튼을 누를 때마다 아침 → 점심 → 저녁으로 바뀌어요. ‘간식’을 켜고 추가하면 고른 시간대의 식사 아래에 붙어요.</div>
          <div id="mealList"></div>
        </div>
      </div>
    </section>

    <section id="journal">
      <div class="card" id="qForm">
        <h3>문구 기록</h3>
        <div class="desc">책·영상 등을 보다가 남기고 싶은 문구를, 알게 된 날짜와 함께 적어 두세요</div>
        <textarea id="qText" placeholder="기록하고 싶은 문구"></textarea>
        <input id="qSrc" type="text" autocomplete="off" placeholder="출처 (책·영상 제목, 저자/채널 등)" style="margin-top:8px">
        <div class="optrow"><span class="lab">종류</span><span id="qTypes" style="display:contents"></span></div>
        <div class="field"><label>알게 된 날짜</label><input id="qDate" type="date"></div>
        <button class="btn" id="qSave" style="width:100%">기록하기</button>
      </div>
      <div class="filters"><input id="qSearch" type="search" placeholder="문구·출처 검색" style="flex:1;min-width:140px"><span id="qFilters" style="display:contents"></span></div>
      <div id="qList"></div>
      <div class="sec-h"><span>날짜별 명언 / 배움 일기 (달력에서 날짜를 눌러 적은 것)</span></div>
      <div id="diaryList"></div>
    </section>
    <section id="track"><div id="trackBody"></div></section>
  </main>

  <button id="fab" aria-label="일정 추가">+</button>
</div>

<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>
<div id="toast" class="hidden"></div>

<script type="module">

    out.push({ id: f.id, label: "  ".repeat(depth) + (depth ? "└ " : "") + f.name }); walk(f.id, depth + 1);
  });

}

  return (names.join(" › ") || "(알 수 없는 폴더)") + (first && first.archived ? " (보관됨)" : "");
}

}

function parseQuick(raw, allowTime) {
  let text = raw.trim(), effort = 0, start = null, end = null;
  const m = text.match(/\s*\/([123])\s*$/);
  if (m) { effort = Number(m[1]); text = text.slice(0, m.index).trim(); }
  if (allowTime) {
    const t = text.match(/^(\d{1,2}):(\d{2})(?:\s*[-~–]\s*(\d{1,2}):(\d{2}))?\s+(.+)$/);
    if (t) {
      const s = Number(t[1]) * 60 + Number(t[2]);
      let e = t[3] != null ? Number(t[3]) * 60 + Number(t[4]) : s + 60;
      if (s < 1440) { if (e <= s || e > 1440) e = Math.min(s + 60, 1440); start = s; end = e; text = t[5].trim(); }
    }
  }
  return { title: text, effort, start, end };
}

/* =========================================================
   꾹 눌러서(터치) / 끌어서(마우스) 순서 바꾸기 — 루틴, 진행바 공용
   ========================================================= */
const SORT = { active: false };
document.addEventListener("touchmove", (e) => { if (SORT.active) e.preventDefault(); }, { passive: false });
function makeSortable(box, itemSel, commit) {
  let st = null, suppress = false;
  const reset = () => {
    if (!st) return;
    clearTimeout(st.timer);
    if (st.active) st.items.forEach((el) => { el.style.transform = ""; el.style.transition = ""; el.classList.remove("sorting"); });
    SORT.active = false; st = null;
  };
  const activate = () => {
    if (!st || st.active) return;
    st.items = [...box.querySelectorAll(itemSel)]; st.from = st.items.indexOf(st.el);
    if (st.from < 0 || st.items.length < 2) { reset(); return; }
    st.rects = st.items.map((el) => el.getBoundingClientRect());
    const n = st.items.length, r = st.rects;
    st.step = st.from < n - 1 ? r[st.from + 1].top - r[st.from].top : r[st.from].top - r[st.from - 1].top;
    st.active = true; st.to = st.from; SORT.active = true;
    st.items.forEach((el) => { if (el !== st.el) el.style.transition = "transform .12s"; });
    st.el.classList.add("sorting");
    try { st.el.setPointerCapture(st.pid); } catch {}
    vibrate(20);
  };
  box.addEventListener("pointerdown", (e) => {
    if (e.button > 0 || st) return;
    const el = e.target.closest(itemSel); if (!el || !box.contains(el)) return;
    if (e.target.closest("input, select, textarea")) return;
    st = { el, sx: e.clientX, sy: e.clientY, pid: e.pointerId, active: false, mouse: e.pointerType === "mouse" };
    if (!st.mouse) st.timer = setTimeout(activate, 380); // 터치: 꾹 누르면 시작
  });
  box.addEventListener("pointermove", (e) => {
    if (!st || e.pointerId !== st.pid) return;
    const dx = e.clientX - st.sx, dy = e.clientY - st.sy;
    if (!st.active) {
      if (st.mouse && Math.hypot(dx, dy) > 5) activate();            // 마우스: 5px 이상 끌면 시작
      else if (!st.mouse && Math.hypot(dx, dy) > 9) reset();         // 터치: 꾹 누르기 전에 움직이면 일반 스크롤
      if (!st || !st.active) return;
    }
    e.preventDefault();
    const { from, rects, items } = st, mid = rects[from].top + rects[from].height / 2 + dy;
    st.el.style.transform = `translateY(${dy}px)`;
    let to = from;
    items.forEach((_, i) => {
      if (i === from) return; const m = rects[i].top + rects[i].height / 2;
      if (i > from && mid > m) to = Math.max(to, i);
      if (i < from && mid < m) to = Math.min(to, i);
    });
    st.to = to;
    items.forEach((el, i) => {
      if (i === from) return;
      const sh = to > from && i > from && i <= to ? -st.step : to < from && i < from && i >= to ? st.step : 0;
      el.style.transform = sh ? `translateY(${sh}px)` : "";
    });
  });
  const end = (e, cancel) => {
    if (!st || e.pointerId !== st.pid) return;
    if (st.active) {
      suppress = true; setTimeout(() => { suppress = false; }, 80);
      if (!cancel && st.to !== st.from) {
        const ids = st.items.map((el) => el.dataset.id); const [m] = ids.splice(st.from, 1); ids.splice(st.to, 0, m);
        commit(ids);
      }
    }
    reset();
  };
  box.addEventListener("pointerup", (e) => end(e, false));
  box.addEventListener("pointercancel", (e) => end(e, true));
  box.addEventListener("click", (e) => { if (suppress) { e.stopPropagation(); e.preventDefault(); } }, true);
  box.addEventListener("contextmenu", (e) => { if (st) e.preventDefault(); });
}
// 순서값(타임스탬프 등)을 새 순서대로 다시 나눠 줌 — 보이지 않는 항목의 상대 순서는 그대로 유지
function reorderKeys(colName, field, objs, newIds, keyOf) {
  const keys = objs.map(keyOf).sort((a, b) => a - b);
  for (let i = 1; i < keys.length; i++) if (keys[i] <= keys[i - 1]) keys[i] = keys[i - 1] + 1;
  const b = writeBatch(db); let n = 0;
  newIds.forEach((id, i) => { const o = objs.find((x) => x.id === id); if (o && keyOf(o) !== keys[i]) { b.update(dref(colName, id), { [field]: keys[i] }); n++; } });
  if (n) b.commit();
}

/* =========================================================

   ========================================================= */
const progOf = (t) => Math.max(0, Math.min(100, Math.round(Number(t.progress) || (t.done ? 100 : 0))));
function setProgress(t, v) {

  const patch = { progress: v };
  if (v >= 100 && !t.done) { patch.done = true; patch.doneAt = Date.now(); vibrate(30); confetti(innerWidth / 2, innerHeight / 3, 50); }
  if (v < 100 && t.done) { patch.done = false; patch.doneAt = null; }
  updateTask(t.id, patch);
}
function progItem(t) {
  const v = progOf(t);
  const fill = h("i", { style: `width:${v}%` }), bar = h("div", { class: "pbar" + (v >= 100 ? " full" : "") }, fill);
  const rng = h("input", { type: "range", min: "0", max: "100", step: "5", value: String(v), "aria-label": "진행률 조절" });

  num.addEventListener("change", () => { const n = Number(num.value); setProgress(t, Number.isFinite(n) ? n : v); });

  return h("div", { class: "pitem" + (t.done ? " done" : ""), "data-id": t.id },
    h("div", { class: "pl1" }, h("i", { class: "pdot" }), h("button", { class: "ptitle", type: "button", onclick: () => openTaskEditor(t) }, t.title), meta ? h("span", { class: "pmeta" }, meta) : null),
    h("div", { class: "pl2" }, bar, h("label", { class: "pnum" }, num, "%")));
}

  const b = writeBatch(db);
  sub.forEach((x) => b.update(dref("folders", x.id), { archived: true, archivedAt: Date.now() }));
  ideas.forEach((t) => b.update(dref("tasks", t.id), { folderId: null }));
  await b.commit();
}
async function restoreFolder(f) {
  const ids = new Set([f.id]);
  let p = folderById(f.parentId), guard = 0; while (p && guard++ < 20) { ids.add(p.id); p = folderById(p.parentId); }
  S.folders.forEach((x) => { if (isDescendant(x.id, f.id)) ids.add(x.id); });
  const b = writeBatch(db);
  S.folders.filter((x) => ids.has(x.id) && x.archived).forEach((x) => b.update(dref("folders", x.id), { archived: false, archivedAt: null }));
  await b.commit(); toast(`“${f.name}” 폴더를 복원했어요`);
}

}

// 일정 3종류: 종일(바) / 시간 지정(세로선) / 리마인더(동그라미 체크박스)
const kindOf = (t) => (t.kind === "reminder" ? "reminder" : t.start != null ? "timed" : "allday");
const KRANK = { allday: 0, timed: 1, reminder: 2 };
const cmpEv = (a, b) => (KRANK[kindOf(a)] - KRANK[kindOf(b)]) || ((a.start ?? -1) - (b.start ?? -1)) || (a.createdAt - b.createdAt);
// 반복 일정: repeat=[요일 0~6], date=시작일, repeatEnd=끝나는 날(선택), skip=건너뛴 날, doneDates=날짜별 완료
function occursOn(t, d) {
  if (!t.date) return false;
  if (!isRep(t)) return t.date === d;
  return d >= t.date && (!t.repeatEnd || d <= t.repeatEnd) && t.repeat.includes(parseYmd(d).getDay()) && !(t.skip || []).includes(d);
}
const occ = (t, d) => (isRep(t) ? { ...t, _occ: d, done: (t.doneDates || []).includes(d) } : t);
const eventsOn = (d) => S.tasks.filter((t) => occursOn(t, d)).map((t) => occ(t, d)).sort(cmpEv);
function occBetween(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(...eventsOn(d)); return out; }
const repLabel = (t) => (isRep(t) ? "매주 " + [1, 2, 3, 4, 5, 6, 0].filter((x) => t.repeat.includes(x)).map((x) => DOW[x]).join("") : "");
const inGrid = (t) => kindOf(t) === "timed" && t.end != null;

// 겹치는 시간 일정을 나란히 배치 (세로선 스타일 블록)
function placeBlocks(host, evts, s0, HH) {
  const items = evts.map((t) => ({ t, s: t.start, e: Math.max(t.end, t.start + 15) })).sort((a, b) => a.s - b.s || a.e - b.e);
  const placed = []; let cluster = [], cEnd = -1;
  const flush = () => {
    if (!cluster.length) return;
    const ends = [];
    cluster.forEach((it) => { let c = 0; while (ends[c] != null && ends[c] > it.s) c++; ends[c] = it.e; it.c = c; });
    cluster.forEach((it) => { it.n = ends.length; placed.push(it); });
    cluster = []; cEnd = -1;
  };
  items.forEach((it) => { if (cluster.length && it.s >= cEnd) flush(); cluster.push(it); cEnd = Math.max(cEnd, it.e); });
  flush();
  placed.forEach(({ t, s, e, c, n }) => {
    const top = ((s - s0 * 60) / 60) * HH, height = Math.max(((e - s) / 60) * HH - 1, 16);
    const kids = [h("b", {}, t.title)];
    if (height >= 34) kids.push(h("small", {}, fmtMin(t.start)));
    const blk = h("div", { class: "blk col-" + (t.color || "c0") + (t.done ? " done" : ""),
      style: `top:${top}px;height:${height}px;left:${(c / n) * 100}%;width:calc(${100 / n}% - 1px)`, draggable: isRep(t) ? null : "true",
      onclick: (ev) => { ev.stopPropagation(); openTaskEditor(t); } }, kids);
    blk.addEventListener("dragstart", (ev) => { S.dragKind = "task"; S.dragId = t.id; ev.dataTransfer.setData("text/plain", t.id); ev.stopPropagation(); });
    blk.addEventListener("dragend", () => { S.dragId = null; S.dragKind = null; });
    host.append(blk);
  });
}

// 주간: 월~일 7열이 항상 화면 폭 안에 들어오는 압축 그리드 (가로 스크롤 없음)
function renderWeek() {
  const ws = weekStartOf(S.date), dates = weekDates(ws), today = todayStr();
  const head = $("#wkhead"), all = $("#wkall"), body = $("#wkbody");

  byD.flat().filter(inGrid).forEach((t) => { s0 = Math.min(s0, Math.floor(t.start / 60)); e0 = Math.max(e0, Math.ceil(t.end / 60)); });
  const HH = calWide() ? 52 : 38, H = (e0 - s0) * HH;

  head.append(h("div", { class: "wkh" }));
  dates.forEach((d) => {
    const dw = parseYmd(d).getDay(), hs = holidaysOf(d), c = wdClass(dw, hs);
    head.append(h("button", { class: "wkh" + (d === today ? " today" : ""), type: "button", onclick: () => openDaySheet(d) },
      h("span", { class: "wd " + c }, DOW[dw]), h("b", { class: "wn " + c }, parseYmd(d).getDate())));
  });
  all.append(h("div", { class: "ucell g" }));
  dates.forEach((d, i) => {
    const cell = h("div", { class: "ucell", onclick: () => openDaySheet(d) });
    holidaysOf(d).forEach((x) => cell.append(h("span", { class: "hol " + (x.l === "ko" ? "kr" : "ca"), title: x.n }, x.n)));
    const list = byD[i].filter((t) => !inGrid(t));
    list.slice(0, 3).forEach((t) => cell.append(evChip(t)));
    if (list.length > 3) cell.append(h("span", { class: "mmore" }, `+${list.length - 3}`));
    all.append(cell);
  });

  const gut = h("div", { class: "gut", style: `height:${H}px` });
  for (let hr = s0; hr <= e0; hr++) gut.append(h("span", { class: hr === s0 ? "f" : hr === e0 ? "l" : "", style: `top:${(hr - s0) * HH}px` }, pad(hr)));
  body.append(gut);
  dates.forEach((d, i) => {
    const c = h("div", { class: "dcol" + (d === today ? " today" : ""), style: `height:${H}px;background-size:100% ${HH}px` });
    placeBlocks(c, byD[i].filter(inGrid), s0, HH);
    const minutesAt = (y0) => Math.max(s0 * 60, Math.min(e0 * 60 - 15, s0 * 60 + Math.floor(((y0 - c.getBoundingClientRect().top) / HH) * 4) * 15));
    c.addEventListener("click", (e) => { if (!e.target.closest(".blk")) newEvent(d, minutesAt(e.clientY)); });
    c.addEventListener("dragover", (e) => { if (S.dragKind === "task") e.preventDefault(); });
    c.addEventListener("drop", (e) => {
      e.preventDefault();
      const t = S.tasks.find((x) => x.id === S.dragId); S.dragId = null; S.dragKind = null; if (!t) return;
      if (isRep(t)) { toast("반복 일정은 편집창에서 바꿔요"); return; }
      const m = minutesAt(e.clientY), dur = t.start != null && t.end != null ? t.end - t.start : 60, end = Math.min(m + dur, 1440);
      updateTask(t.id, { date: d, start: Math.min(m, end - 15), end, kind: "event" });
    });
    if (d === today) {
      const now = new Date(), m = now.getHours() * 60 + now.getMinutes();
      if (m >= s0 * 60 && m <= e0 * 60) c.append(h("div", { class: "nowline", style: `top:${((m - s0 * 60) / 60) * HH}px` }));
    }
    body.append(c);
  });
  if (S.needScroll) {
    const w = $("#wkwrap");
    if (w.offsetParent !== null) {
      const first = byD.flat().filter(inGrid).length ? Math.min(...byD.flat().filter(inGrid).map((t) => t.start)) : (dates.includes(today) ? new Date().getHours() * 60 : 8 * 60);
      w.scrollTop = Math.max(0, body.offsetTop - $(".wktop").offsetHeight + ((first - s0 * 60) / 60) * HH - 40); S.needScroll = false;
    }
  }
}

/* =========================================================
   자동완성: 예전에 쓴 제목과 비슷하면 팝업으로 보여주고, 고르면 색·부담도·폴더·시간까지 복사
   ========================================================= */
function suggestFor(q) {
  const ql = q.trim().toLowerCase().replace(/\s+/g, ""); if (!ql) return [];
  const map = new Map();
  S.tasks.forEach((t) => {
    const key = t.title.trim().toLowerCase(); if (!key) return;
    const o = map.get(key) || { count: 0, task: t };
    o.count++; if ((t.createdAt || 0) >= (o.task.createdAt || 0)) o.task = t; map.set(key, o);
  });
  const out = [];
  map.forEach((o, key) => {
    const flat = key.replace(/\s+/g, "");
    if (!flat.includes(ql)) return;
    out.push({ title: o.task.title.trim(), count: o.count, task: o.task, rank: flat.startsWith(ql) ? 0 : 1 });
  });
  return out.sort((a, b) => a.rank - b.rank || b.count - a.count || (b.task.createdAt || 0) - (a.task.createdAt || 0)).slice(0, 5);
}
// 반드시 입력창의 keydown(Enter) 처리기보다 "먼저" 호출해야 Enter가 자동완성 선택으로 먼저 쓰인다
function attachSuggest(input, onPick, getQuery) {
  const wrap = input.parentElement, pop = h("div", { class: "suggest hidden" }); wrap.append(pop);
  let items = [], idx = -1;
  const close = () => { pop.classList.add("hidden"); items = []; idx = -1; };
  const pick = (s) => { input.value = s.title; close(); onPick && onPick(s.task); input.focus(); };
  const draw = () => {
    pop.textContent = "";
    items.forEach((s, i) => pop.append(h("button", { type: "button", class: "sg col-" + (s.task.color || "c0") + (i === idx ? " on" : ""),
      onpointerdown: (e) => { e.preventDefault(); pick(s); } },
      h("i", {}), h("span", { class: "sgt" }, s.title), h("small", {}, `${s.count}회` + (s.task.start != null ? " · " + fmtMin(s.task.start) : "")))));
    pop.classList.toggle("hidden", !items.length);
  };
  input.addEventListener("input", () => { items = suggestFor(getQuery ? getQuery(input.value) : input.value); idx = -1; draw(); });
  input.addEventListener("keydown", (e) => {
    if (!items.length) return;
    if (e.key === "ArrowDown") { e.preventDefault(); idx = (idx + 1) % items.length; draw(); }
    else if (e.key === "ArrowUp") { e.preventDefault(); idx = (idx - 1 + items.length) % items.length; draw(); }
    else if (e.key === "Enter" && !e.isComposing && idx >= 0) { e.preventDefault(); e.stopImmediatePropagation(); pick(items[idx]); }
    else if (e.key === "Escape") { e.stopPropagation(); close(); }
  });
  input.addEventListener("blur", () => setTimeout(close, 150));
}

/* =========================================================
   날짜 시트: 그날의 일정 + 빠른 추가 + 명언/배움 일기
   ========================================================= */
function openDaySheet(date) {
  const dd = parseYmd(date), evBox = h("div", {}), hs = holidaysOf(date);
  const draw = () => {
    evBox.textContent = "";
    const ts = eventsOn(date);
    if (!ts.length) evBox.append(h("div", { class: "empty" }, "이 날 일정이 없어요"));
    ts.forEach((t) => {
      const k = kindOf(t);
      const chk = h("button", { class: "check" + (t.done ? " on" : ""), type: "button", "aria-label": "완료", onclick: () => toggleDone(t, chk) }, t.done ? "✓" : "");
      const label = (k === "timed" ? fmtMin(t.start) + (t.end != null ? "–" + fmtMin(t.end) : "") : k === "reminder" ? "리마인더" + (t.start != null ? " " + fmtMin(t.start) : "") : "종일") + (isRep(t) ? " · ↻" + repLabel(t).replace("매주 ", "") : "");
      evBox.append(h("div", { class: "prop col-" + (t.color || "c0") }, chk,
        h("button", { class: "evt", type: "button", onclick: () => openTaskEditor(t, false, date), style: t.done ? "color:var(--sub);text-decoration:line-through" : "" }, h("i", { class: "sw" }), t.title),
        h("span", { class: "t" }, label)));
    });
  };
  draw();

  const inp = h("input", { type: "text", placeholder: "일정 추가 (예: 19:00 수영 /1)  Enter", autocomplete: "off", enterkeyhint: "done" });
  const wrap = h("div", { class: "sgwrap", style: "margin-top:10px" }, inp);
  let tpl = null, asRem = false;
  const remChip = h("button", { type: "button", class: "chip", onclick: () => { asRem = !asRem; remChip.classList.toggle("on", asRem); } }, "리마인더로 추가");
  attachSuggest(inp, (t) => { tpl = t; if (kindOf(t) === "reminder" && !asRem) { asRem = true; remChip.classList.add("on"); } }, (v) => parseQuick(v, true).title);
  inp.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    const q = parseQuick(inp.value, true); if (!q.title) return;
    const u = tpl && tpl.title.trim() === q.title ? tpl : null, hasTime = q.start != null, isRem = asRem;

/* ---------- 시간 입력: [오전|오후] 토글 + 시(1~12) + 분(5분 단위) ---------- */
function timeField(init, opt = {}) {
  let pm = false;
  const hs = h("select", { class: "tf-h", "aria-label": "시" }), ms = h("select", { class: "tf-m", "aria-label": "분" });
  if (opt.optional) hs.append(h("option", { value: "" }, "--"));
  for (let i = 1; i <= 12; i++) hs.append(h("option", { value: String(i) }, String(i)));
  const addMin = (m) => ms.append(h("option", { value: String(m) }, pad(m)));
  for (let m = 0; m < 60; m += 5) addMin(m);
  const am = h("span", {}, "오전"), pmS = h("span", {}, "오후");
  const ap = h("button", { class: "tf-ap", type: "button", "aria-label": "오전/오후 바꾸기" }, am, pmS);
  const el = h("div", { class: "tf" }, ap, hs, h("span", { class: "tf-c" }, ":"), ms);
  const api = { el, onchange: null };
  const draw = () => {
    am.className = pm ? "" : "on"; pmS.className = pm ? "on" : "";
    const empty = hs.value === ""; ap.disabled = empty; ms.disabled = empty; el.classList.toggle("empty", empty);
  };
  const fire = () => { draw(); api.onchange && api.onchange(); };
  ap.onclick = () => { pm = !pm; fire(); };                       // 한 번 누르면 오전 ↔ 오후
  hs.onchange = () => { if (hs.value !== "" && ms.disabled) ms.value = "0"; fire(); };
  ms.onchange = fire;
  api.set = (min) => {
    if (min == null) { if (opt.optional) hs.value = ""; else { hs.value = "9"; ms.value = "0"; pm = false; } draw(); return; }
    const m = min % 1440; pm = m >= 720; hs.value = String((Math.floor(m / 60) % 12) || 12);
    const mm = m % 60; if (![...ms.options].some((o) => Number(o.value) === mm)) { addMin(mm); [...ms.options].sort((a, b) => a.value - b.value).forEach((o) => ms.append(o)); }
    ms.value = String(mm); draw();
  };
  api.get = () => {
    if (hs.value === "") return null;
    const v = (Number(hs.value) % 12 + (pm ? 12 : 0)) * 60 + Number(ms.value);
    return opt.end && v === 0 ? 1440 : v;                           // 끝 시간 '오전 12:00' = 자정(24:00)
  };
  api.set(init);
  return api;
}

function gcalUrl(p) {
  const base = "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(p.title);
  let date = p.date || S.date, rec = "";
  if (Array.isArray(p.repeat) && p.repeat.length) {   // 반복: 첫 해당 요일로 맞추고 RRULE 추가
    for (let i = 0; i < 7 && !p.repeat.includes(parseYmd(date).getDay()); i++) date = addDays(date, 1);
    rec = "&recur=" + encodeURIComponent("RRULE:FREQ=WEEKLY;BYDAY=" + p.repeat.map((x) => ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][x]).join(",") + (p.repeatEnd ? ";UNTIL=" + p.repeatEnd.replace(/-/g, "") : ""));

  if (p.start != null) { const f = (m) => d8 + "T" + pad(Math.floor(m / 60) % 24) + pad(m % 60) + "00"; return base + "&dates=" + f(p.start) + "/" + f(p.end) + rec; }
  return base + "&dates=" + d8 + "/" + addDays(date, 1).replace(/-/g, "") + rec;
}

/* =========================================================
   루틴 탭 — 아침/점심/저녁 + 상단 카테고리

const SLOTS = [["morning", "아침"], ["noon", "점심"], ["evening", "저녁"]];
const catsSorted = () => [...S.cats].sort(byOrder);
const routineApplies = (r, dow) => !r.days || !r.days.length || r.days.includes(dow);
const routinesOn = (date) => {
  const dow = parseYmd(date).getDay();
  return S.routines.filter((r) => routineApplies(r, dow) && (!r.createdAt || ymd(new Date(r.createdAt)) <= date)).sort(byOrder);
};
function guessSlot(title) {
  if (/아침|기상|모닝|조깅|출근/.test(title)) return "morning";
  if (/점심|낮|런치/.test(title)) return "noon";
  if (/저녁|밤|취침|자기 ?전|퇴근|야간/.test(title)) return "evening";
  return null;
}
function chainOf(r, date) {
  const kept = (d) => S.logs.get(`${r.id}|${d}`); let d = date, n = 0;
  if (!kept(d)) d = addDays(d, -1);
  for (let i = 0; i < 90; i++) {
    if (routineApplies(r, parseYmd(d).getDay())) { if (kept(d)) n++; else break; }
    d = addDays(d, -1);
  }
  return n;
}
function setLog(rid, date, status, el) {
  const cur = S.logs.get(`${rid}|${date}`), id = `${rid}_${date}`;
  if (cur === status) { deleteDoc(dref("routineLogs", id)); return; }
  setDoc(dref("routineLogs", id), { routineId: rid, date, status });
  vibrate(30);
  if (el) { const r = el.getBoundingClientRect(); confetti(r.left + r.width / 2, r.top + r.height / 2, 14); }
}

    items.forEach((r) => sec.append(routineRow(r, date, low)));

/* =========================================================
   식단 기록 (루틴 화면 오른쪽 / 모바일은 맨 아래)  meals: {date, slot, snack, text, createdAt}
   ========================================================= */
const nextSlot = (k) => SLOTS[(SLOTS.findIndex((x) => x[0] === k) + 1) % SLOTS.length][0];

const slotNow = () => { const hr = new Date().getHours(); return hr < 11 ? "morning" : hr < 16 ? "noon" : "evening"; };

/* =========================================================
   주간 성취도 트래커
   ========================================================= */
function tier(rate) {
  if (rate == null) return { label: "기록 없음", color: "var(--line)", star: false };
  if (rate >= 80) return { label: "아주 잘함", color: "var(--g)", star: true };
  if (rate >= 60) return { label: "중간", color: "var(--y)", star: false };
  if (rate >= 31) return { label: "조금만 더", color: "var(--sub)", star: false };
  return { label: "노력 필요", color: "var(--r)", star: false };
}
const pct = (d, t) => (t ? Math.round((d / t) * 100) : null);

function weekStats(ws) {
  const dates = weekDates(ws), today = todayStr(), last = dates[6];
  const rr = new Map(); S.routines.forEach((r) => rr.set(r.id, { r, kept: 0, sched: 0, planb: 0 }));
  const days = dates.map((d) => {
    const future = d > today; let kept = 0, sched = 0, ts = [];
    if (!future) {
      routinesOn(d).forEach((r) => { sched++; const o = rr.get(r.id), s = S.logs.get(`${r.id}|${d}`); o.sched++; if (s) { kept++; o.kept++; if (s === "planb") o.planb++; } });
      ts = eventsOn(d);
    }
    const tdone = ts.filter((t) => t.done).length, total = sched + ts.length, done = kept + tdone;
    return { date: d, future, done, total, rate: pct(done, total) };
  });
  const catMap = new Map(); catsSorted().forEach((c) => catMap.set(c.id, { id: c.id, name: c.name, kept: 0, sched: 0, items: [] }));
  const none = { id: null, name: "분류 없음", kept: 0, sched: 0, items: [] };
  rr.forEach((o) => { if (!o.sched) return; const g = (o.r.catId && catMap.get(o.r.catId)) || none; g.kept += o.kept; g.sched += o.sched; g.items.push(o); });
  const cats = [...catMap.values(), none].filter((c) => c.sched > 0);

  const byF = new Map();
  occBetween(ws, last < today ? last : today).forEach((t) => {
    const key = t.folderId || "", o = byF.get(key) || { name: key ? folderPath(key) : "폴더 없음", done: 0, total: 0 };
    o.total++; if (t.done) o.done++; byF.set(key, o);
  });
  const done = days.reduce((n, d) => n + d.done, 0), total = days.reduce((n, d) => n + d.total, 0);
  return { ws, days, cats, folders: [...byF.values()], overall: { done, total, rate: pct(done, total) } };
}

function barRow(label, done, total, o = {}) {
  const rate = pct(done, total), t = tier(rate);
  return h("div", { class: "brow" + (o.small ? " small" : "") },
    h("div", { class: "l1" },
      o.caret != null ? h("button", { class: "txtbtn", type: "button", onclick: o.onclick, style: "padding:0 4px" }, o.caret ? "▾" : "▸") : null,
      h("span", { class: "nm" }, label),
      h("span", { class: "num" }, `${done}/${total}`),
      h("span", { class: "tier", style: `color:${t.color === "var(--line)" ? "var(--sub)" : t.color}` }, (rate == null ? "" : rate + "% ") + (t.star ? "★ " : "") + t.label)),
    h("div", { class: "track" }, h("i", { style: `width:${rate || 0}%;background:${t.color}` })));
}

  });
  root.append(h("div", { class: "card" }, h("h3", {}, "요일별 달성"), h("div", { class: "desc" }, "그날 일정과 루틴을 합쳐서 계산해요"), bars));

  const rc = h("div", { class: "card" }, h("h3", {}, "루틴 카테고리별"), h("div", { class: "desc" }, "Plan B로 한 것도 ‘지킨 것’으로 셉니다. 화살표를 누르면 루틴별로 볼 수 있어요"));
  if (!st.cats.length) rc.append(h("div", { class: "empty" }, "이 주에 해당하는 루틴이 없어요"));
  st.cats.forEach((c) => {
    const key = "cat:" + (c.id || "none"), open = S.openTrack.has(key);
    rc.append(barRow(c.name, c.kept, c.sched, { caret: open, onclick: () => { open ? S.openTrack.delete(key) : S.openTrack.add(key); renderAll(); } }));
    if (open) c.items.forEach((o) => rc.append(barRow(o.r.title + (o.planb ? ` (Plan B ${o.planb}회)` : ""), o.kept, o.sched, { small: true })));
  });
  root.append(rc);

  const fc = h("div", { class: "card" }, h("h3", {}, "폴더별 일정"), h("div", { class: "desc" }, "이 주에 날짜가 정해진 일정 중 오늘까지의 달성 (삭제한 폴더의 기록도 포함돼요)"));
  if (!st.folders.length) fc.append(h("div", { class: "empty" }, "이 주에 날짜가 정해진 일정이 없어요"));
  st.folders.sort((a, b) => b.total - a.total).forEach((f) => fc.append(barRow(f.name, f.done, f.total)));
  root.append(fc);

const cv = $("#conf"), cx = cv.getContext("2d");
function sizeCanvas() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
sizeCanvas(); addEventListener("resize", sizeCanvas);
let parts = [], running = false;
function confetti(x, y, n) {
  const colors = ["#e0a8a4", "#e8c9a0", "#e6d98c", "#9fceab", "#98c4d3", "#a9b4e4", "#c8aedd"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 3 + Math.random() * (n > 40 ? 9 : 5);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3, s: 4 + Math.random() * 4,
      c: colors[(Math.random() * colors.length) | 0], life: 0, max: 45 + Math.random() * 25 });
  }
  if (!running) { running = true; requestAnimationFrame(tick); }
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  const k = devicePixelRatio;
  parts = parts.filter((p) => p.life < p.max);
  for (const p of parts) {
    p.life++; p.x += p.vx; p.y += p.vy; p.vy += 0.28; p.vx *= 0.985;
    cx.globalAlpha = Math.max(0, 1 - p.life / p.max); cx.fillStyle = p.c; cx.fillRect(p.x * k, p.y * k, p.s * k, p.s * k);
  }
  cx.globalAlpha = 1;
  if (parts.length) requestAnimationFrame(tick); else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
}

if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(() => {});
</script>
